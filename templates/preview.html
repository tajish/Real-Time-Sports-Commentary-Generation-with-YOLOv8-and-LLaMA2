<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Football Analysis</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #1e3c72, #2a5298);
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      background: rgba(0, 0, 0, 0.6);
      padding: 20px 30px;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      text-align: center;
      max-width: 90%;
    }

    h1 {
      margin-bottom: 20px;
      font-size: 1.8rem;
      color: #f8f9fa;
    }

    video {
        border-radius: 12px;
        max-width: 800px;  
        width: 100%;       
        height: auto;
        outline: none;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5);
    }

    .footer {
      margin-top: 15px;
      font-size: 0.9rem;
      color: #d1d1d1;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>⚽ Football Analysis Playback</h1>
    <video controls>
        <source src="{{ url_for('static', filename='videos/' + video_name) }}" type="video/mp4">
        Your browser does not support the video tag.
    </video>
    <div class="footer">
      Generated analysis commentary with YOLO & LLaMA 🚀
    </div>
  </div>
</body>
</html>
